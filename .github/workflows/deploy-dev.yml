name: Docker Build & Push and Deploy to dev for roomie-dev

# Manual only until AppDev gives Roomie a server + Docker Hub repo.
# Then uncomment push to deploy on every merge to `main`.
on:
  # push:
  #   branches: [mvp-features]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Get SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Docker Build & Push
        uses: docker/build-push-action@v5
        with:
          context: ./
          file: ./Dockerfile
          push: true
          tags: cornellappdev/roomie-dev:${{ steps.vars.outputs.sha_short }}

      - name: Remote SSH and Deploy
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_TAG: ${{ steps.vars.outputs.sha_short }}
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.DEV_SERVER_KEY }}
          script: |
            export IMAGE_TAG=${{ steps.vars.outputs.sha_short }}
            cd ~/roomie/docker-compose
            docker compose pull
            docker compose up -d
            docker images cornellappdev/roomie-dev --format '{{.ID}}' | tail -n +4 | xargs -r docker rmi || true
