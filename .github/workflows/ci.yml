name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: roomie
          POSTGRES_PASSWORD: roomie
          POSTGRES_DB: roomie_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U roomie" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://roomie:roomie@localhost:5432/roomie_test
      NODE_ENV: test
      AUTH_DEV_BYPASS: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npx tsc --noEmit
      - run: npm test
