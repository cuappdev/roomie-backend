# Local Postgres for development: docker compose -f docker-compose.dev.yml up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: roomie
      POSTGRES_PASSWORD: roomie
      POSTGRES_DB: roomie
    ports:
      - '5432:5432'
    volumes:
      - roomie-db:/var/lib/postgresql/data

volumes:
  roomie-db:
